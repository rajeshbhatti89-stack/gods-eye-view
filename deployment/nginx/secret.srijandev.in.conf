server {
    listen 80;
    server_name secret.srijandev.in;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name secret.srijandev.in;

    # SSL Certificates (Managed by Certbot, but placeholder paths given)
    ssl_certificate /etc/letsencrypt/live/secret.srijandev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secret.srijandev.in/privkey.pem;
    
    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    location / {
        proxy_pass http://127.0.0.1:4173; # Proxy to Docker container
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-lived connections / WebSockets
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
